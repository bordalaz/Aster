services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bd
    command: postgres -c shared_buffers=256MB
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bd"]
      interval: 2s
      retries: 30
  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://bd:${POSTGRES_PASSWORD}@db/bd
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      AIRTABLE_TOKEN: ${AIRTABLE_TOKEN:-}
      # R7: офисная сеть (CIDR через запятую; пусто — частные сети). За обратным прокси
      # обязательно TRUSTED_PROXIES — иначе все придут с адреса прокси (один лимит входа на всех)
      OFFICE_NETS: ${OFFICE_NETS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    depends_on:
      db: { condition: service_healthy }
    # ponytail: код монтируется для разработки; для NAS — отдельный compose в этапе 3
    volumes: [./api:/app, ./data:/data]
    ports: ["8000:8000"]
volumes:
  pgdata: {}
